name: Check static website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.8.3'
      - name: Verify generated pages are current
        run: python3 scripts/build_site.py --check
      - name: Check content, links and metadata
        run: python3 scripts/check_site.py
      - name: Check CV publication blocks
        run: python3 scripts/sync_cv_data.py --check
